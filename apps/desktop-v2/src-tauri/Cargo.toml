[package]
name = "netpulse-desktop-v2"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "netpulse_desktop_v2"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "NetPulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
netpulse-core = { path = "../crates/netpulse-core" }
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rfd = "0.17"
zeroize = "1.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = "0.10"
base64 = "0.23.1"
winreg = "0.56"
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "net", "time", "io-util"] }
