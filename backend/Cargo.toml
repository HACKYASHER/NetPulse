[workspace]
members = ["crates/netpulse-core", "crates/netpulse-service", "crates/netpulse-host"]
default-members = ["crates/netpulse-core"]
resolver = "2"

[workspace.package]
version = "1.0.7"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "socks", "gzip"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinInet", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
