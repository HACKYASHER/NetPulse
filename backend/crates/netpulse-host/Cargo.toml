[package]
name = "netpulse-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "netpulsed"
path = "src/main.rs"

[dependencies]
netpulse-core = { path = "../netpulse-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rfd = "0.17"
zeroize = "1.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = "0.10"
base64 = "0.23.1"
winreg = "0.56"
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }

tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }

